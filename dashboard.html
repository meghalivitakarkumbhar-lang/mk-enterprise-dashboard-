<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>M K ENTERPRISES - Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }


        /* HEADER */

        header {
            background: #123c73;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            font-size: 13px;
            margin-top: 4px;
        }

        .logout-btn {
            background: white;
            color: #123c73;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }


        /* LAYOUT */

        .layout {
            display: flex;
            min-height: calc(100vh - 80px);
        }


        /* SIDEBAR */

        .sidebar {
            width: 240px;
            background: white;
            padding: 25px 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.08);
        }

        .profile {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }

        .profile-icon {
            font-size: 45px;
        }

        .profile h3 {
            color: #123c73;
            margin-top: 8px;
        }

        .profile p {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }


        /* MENU */

        .menu button {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 8px;

            border: none;
            background: transparent;

            text-align: left;

            border-radius: 7px;

            cursor: pointer;

            font-size: 15px;
        }

        .menu button:hover {
            background: #eaf1fb;
            color: #123c73;
        }


        /* CONTENT */

        .content {
            flex: 1;
            padding: 30px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            color: #123c73;
        }

        .welcome p {
            color: #777;
            margin-top: 5px;
        }


        /* CARDS */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #777;
            font-size: 15px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            color: #123c73;
            margin-top: 10px;
        }


        /* QUICK ACTIONS */

        .section {
            background: white;
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);
        }

        .section h2 {
            color: #123c73;
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .action-btn {
            padding: 14px 22px;
            border: none;
            border-radius: 8px;
            background: #123c73;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .action-btn:hover {
            background: #1769aa;
        }


        /* FOOTER */

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 13px;
        }


        /* MOBILE */

        @media(max-width: 900px) {

            .cards {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .sidebar {
                width: 200px;
            }

        }


        @media(max-width: 600px) {

            header {
                padding: 15px;
            }

            header h1 {
                font-size: 18px;
            }

            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 20px 15px;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <div>

        <h1>🏢 M K ENTERPRISES</h1>

        <p>
            CRM Management System
        </p>

    </div>


    <button
        class="logout-btn"
        onclick="logout()">

        Logout

    </button>

</header>



<!-- MAIN LAYOUT -->

<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">


        <div class="profile">

            <div class="profile-icon">
                👤
            </div>

            <h3 id="userName">
                User
            </h3>

            <p id="userRole">
                Role
            </p>

        </div>


        <div class="menu">

            <button>
                📊 Dashboard
            </button>

            <button>
                👥 Customers
            </button>

            <button>
                📞 Call Register
            </button>

            <button>
                📅 Follow-ups
            </button>

            <button>
                💰 Payments
            </button>

            <button>
                📄 Documents
            </button>

            <button>
                📈 Reports
            </button>

            <button id="usersMenu">
                👤 User Management
            </button>

        </div>


    </aside>



    <!-- CONTENT -->

    <main class="content">


        <div class="welcome">

            <h2>
                Welcome to M K ENTERPRISES
            </h2>

            <p id="welcomeText">
                CRM Dashboard
            </p>

        </div>



        <!-- DASHBOARD CARDS -->

        <section class="cards">


            <div class="card">

                <h3>
                    Total Customers
                </h3>

                <div
                    class="number"
                    id="totalCustomers">

                    0

                </div>

            </div>



            <div class="card">

                <h3>
                    Today's Follow-ups
                </h3>

                <div
                    class="number"
                    id="todayFollowups">

                    0

                </div>

            </div>



            <div class="card">

                <h3>
                    Pending
                </h3>

                <div
                    class="number"
                    id="pending">

                    0

                </div>

            </div>



            <div class="card">

                <h3>
                    Completed
                </h3>

                <div
                    class="number"
                    id="completed">

                    0

                </div>

            </div>


        </section>



        <!-- QUICK ACTIONS -->

        <section class="section">

            <h2>
                Quick Actions
            </h2>


            <div class="actions">

                <button class="action-btn">
                    ➕ Add Customer
                </button>

                <button class="action-btn">
                    📞 New Call
                </button>

                <button class="action-btn">
                    📅 Add Follow-up
                </button>

                <button class="action-btn">
                    💰 Add Payment
                </button>

            </div>

        </section>



        <!-- RECENT ACTIVITY -->

        <section class="section">

            <h2>
                Recent Activity
            </h2>

            <p>
                No recent activity available.
            </p>

        </section>


        <footer>

            © 2026 M K ENTERPRISES |
            Thergaon, Pune – 411033

        </footer>


    </main>

</div>



<script>


    /* CHECK LOGIN */

    const loggedInUser =
        localStorage.getItem("loggedInUser");


    if (!loggedInUser) {

        window.location.href =
            "index.html";

    }


    /* USER INFORMATION */

    if (loggedInUser) {

        const user =
            JSON.parse(loggedInUser);


        document.getElementById(
            "userName"
        ).innerText =
            user.email;


        document.getElementById(
            "userRole"
        ).innerText =
            user.role;


        document.getElementById(
            "welcomeText"
        ).innerText =
            "Logged in as " + user.role;


        /*
        USER MANAGEMENT ONLY
        FOR SUPER ADMIN
        */

        if (user.role !== "Super Admin") {

            document.getElementById(
                "usersMenu"
            ).style.display = "none";

        }

    }


    /* LOGOUT */

    function logout() {

        localStorage.removeItem(
            "loggedInUser"
        );

        window.location.href =
            "index.html";

    }


</script>


</body>

</html>
