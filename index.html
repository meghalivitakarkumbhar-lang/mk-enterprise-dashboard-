<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>M K ENTERPRISES - Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="login-page">

        <div class="login-box">

            <div class="logo">
                🏢
            </div>

            <h1>M K ENTERPRISES</h1>

            <p class="subtitle">
                CRM MANAGEMENT SYSTEM
            </p>


            <form id="loginForm">

                <label>
                    Email ID / User ID
                </label>

                <input
                    type="text"
                    id="email"
                    placeholder="Enter Email ID"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >


                <button type="submit">
                    LOGIN
                </button>


                <p id="loginMessage"></p>

            </form>


            <div class="login-footer">

                <p>
                    M K ENTERPRISES
                </p>

                <p>
                    Thergaon, Pune – 411033
                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
